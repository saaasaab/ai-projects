<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AutoCover</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 12px;
        font: 11px/1.4 "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--figma-color-text, #333);
        background: var(--figma-color-bg, #fff);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
      }

      fieldset {
        border: none;
        margin: 0 0 12px;
        padding: 0;
      }

      legend {
        font-weight: 600;
        margin-bottom: 6px;
      }

      label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      .row label {
        flex: 1;
        margin: 0;
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
      }

      input[type="number"],
      select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--figma-color-border, #e5e5e5);
        border-radius: 4px;
        font: inherit;
        background: var(--figma-color-bg, #fff);
        color: inherit;
      }

      input[type="checkbox"] {
        margin: 0;
      }

      button {
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: var(--figma-color-bg-brand, #18a0fb);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      button:hover:not(:disabled) {
        filter: brightness(0.95);
      }

      .status {
        margin: 8px 0 0;
        color: var(--figma-color-text-secondary, #666);
        min-height: 2.8em;
      }

      .status.error {
        color: var(--figma-color-text-danger, #f24822);
      }

      .hint {
        color: var(--figma-color-text-secondary, #666);
        font-size: 10px;
        margin-top: 4px;
      }

      .preview {
        position: relative;
        width: 100%;
        height: 140px;
        margin: 0 0 12px;
        border-radius: 6px;
        overflow: hidden;
        background: var(--figma-color-bg-secondary, #f0f0f0);
        border: 1px solid var(--figma-color-border, #e5e5e5);
      }

      .preview canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .preview--empty canvas {
        display: none;
      }

      .preview-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        text-align: center;
        color: var(--figma-color-text-secondary, #666);
        font-size: 10px;
        pointer-events: none;
      }

      .preview:not(.preview--empty) .preview-label {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        height: auto;
        padding: 4px 8px;
        justify-content: flex-start;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.55));
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>AutoCover</h1>
    <p class="hint">
      Draw a rectangle over text or numbers, select only that rectangle, then run AutoCover.
    </p>

    <div id="preview" class="preview preview--empty">
      <canvas id="preview-canvas" width="280" height="140"></canvas>
      <p id="preview-label" class="preview-label">Select your mask rectangle</p>
    </div>

    <form id="form">
      <fieldset>
        <legend>Layout</legend>
        <div class="row">
          <label>
            Orientation
            <select name="orientation">
              <option value="vertical" selected>Vertical strips</option>
              <option value="horizontal">Horizontal strips</option>
            </select>
          </label>
          <label>
            Strips
            <input type="number" name="stripCount" min="1" max="100" value="4" />
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Sampling</legend>
        <div class="row">
          <label>
            Sample edge
            <select name="sampleEdge">
              <option value="top" selected>Top</option>
              <option value="bottom">Bottom</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
              <option value="auto">Auto (lower contrast)</option>
            </select>
          </label>
          <label>
            Offset (px)
            <input type="number" name="sampleOffset" min="0" max="50" value="2" />
          </label>
        </div>
        <label>
          <input type="checkbox" name="smoothing" />
          Blur / smoothing (average nearby pixels)
        </label>
      </fieldset>

      <fieldset>
        <legend>After apply</legend>
        <label>
          <input type="checkbox" name="removeMask" checked />
          Hide original mask rectangle
        </label>
      </fieldset>

      <button type="submit" id="run">AutoCover</button>
    </form>

    <p id="status" class="status">Ready.</p>

    <script src="../dist/ui.js"></script>
  </body>
</html>
